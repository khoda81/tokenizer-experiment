[project]
name = "tokenizer-experiment"
version = "0.1.0"
description = "WikiText experiments comparing tokenizers under block-prequential Transformer codelength."
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "tokenizers>=0.20",
  "torch>=2.4",
  "tqdm>=4.66",
  "wandb>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenizer_experiment"]

[tool.pytest.ini_options]
pythonpath = ["src"]
